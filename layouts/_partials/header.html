{{ if not .IsHome }}
<header class="site-header">
    <a class="brand logo-text" href="{{ .Site.Home.RelPermalink }}">FOSDEM<span>'{{ .Site.Params.YearShort }}</span></a>

    <nav class="topnav">
        <ul>
            {{- with .Site.GetPage "/news" }}
            <li><a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>News</a></li>
            {{- end }}
            {{- with .Site.GetPage "/practical" }}
            <li><a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a></li>
            {{- end }}
            {{- with .Site.GetPage "/support" }}
            <li><a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>Support</a></li>
            {{- end }}
        </ul>
    </nav>
</header>
{{ end }}
