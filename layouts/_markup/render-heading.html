{{- $level := .Level -}}
{{- if eq $level 1 -}}
{{- $level = 2 -}}
{{- warnf "render-heading: %s uses a level 1 heading in the body; demoted to h2 because the template already emits the title as h1" .PageInner.File.Path -}}
{{- end -}}
<h{{ $level }} id="{{ .Anchor | safeURL }}">{{ .Text }}</h{{ $level }}>
