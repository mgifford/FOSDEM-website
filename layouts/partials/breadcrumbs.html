<nav class="breadcrumbs" data-pagefind-ignore="all">
    {{ range $i, $p := .Ancestors.Reverse }}
        {{ if $p.LinkTitle }}
            {{ if gt $i 0 }} / {{ end }}
            <a href="{{ $p.RelPermalink }}">{{ $p.LinkTitle }}</a>
        {{ end }}
    {{ end }}
    {{ if .Ancestors }} / {{ end }}
    <span>{{ .LinkTitle }}</span>
</nav>
