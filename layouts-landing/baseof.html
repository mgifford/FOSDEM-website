<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ partial "title.html" . }} &mdash; {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="{{ `logo.svg` | relURL }}" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" href="{{ `css/style.css` | relURL }}">
    <link rel="stylesheet" href="{{ `css/landing.css` | relURL }}">
    {{ with .OutputFormats.Get "rss" -}}
    <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
    {{- end }}

    <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ partial "title.html" . }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    {{ with partial "featured-image.html" . -}}
    {{ $og := . }}{{ if gt .Width 1200 }}{{ $og = .Resize "1200x" }}{{ end -}}
    <meta property="og:image" content="{{ $og.Permalink }}">
    <meta property="og:image:width" content="{{ $og.Width }}">
    <meta property="og:image:height" content="{{ $og.Height }}">
    {{- end }}

    <script>
        // Same behaviour as the main site: explicit choice wins, else follow the OS.
        // Runs in head so the theme is set before first paint.
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    </script>
</head>

<body>
    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <script>
        const toggle = document.getElementById('themeToggle');
        const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
        toggle.setAttribute('aria-pressed', isDark());

        toggle.addEventListener('click', () => {
            const theme = isDark() ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            toggle.setAttribute('aria-pressed', theme === 'dark');
        });
    </script>
</body>

</html>
