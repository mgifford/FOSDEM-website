<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="{{ `logo.svg` | absURL }}" sizes="any" type="image/svg+xml">
    <link rel="stylesheet" href="{{ `css/style.css` | absURL }}">
    <link rel="stylesheet" href="{{ `css/landing.css` | absURL }}">
    {{ with .OutputFormats.Get "rss" -}}
    <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
    {{- end }}
</head>

<body>
    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <script>
        // Same behaviour as the main site: explicit choice wins, else follow the OS.
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    </script>
</body>

</html>
