{{ with .Paginator }}
{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="News pages">
    {{ if .HasPrev }}
    <a href="{{ .Prev.URL }}" rel="prev">&larr; Newer</a>
    {{ else }}
    <span></span>
    {{ end }}

    <span class="pagination-count">Page {{ .PageNumber }} of {{ .TotalPages }}</span>

    {{ if .HasNext }}
    <a href="{{ .Next.URL }}" rel="next">Older &rarr;</a>
    {{ else }}
    <span></span>
    {{ end }}
</nav>
{{ end }}
{{ end }}
