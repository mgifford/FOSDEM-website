when:
  - event: push
    branch: main
  - event: [pull_request, pull_request_closed]
  - event: cron

variables:
  - &nix_image nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
  - &nix_config "experimental-features = nix-command flakes"
  - &rsync_image drillster/drone-rsync@sha256:c79d15e8456dd4ebfde333f59a0e595e273fd6c4f6db7e70da87c2e1126241e3
  - &comment_image git.fosdem.org/fosdem/woodpecker-plugins/pr-comment@sha256:0b11ebc3501a10b9a2a259aec82743cb19209aa7aa064ca7d26d85f82d5d4830
  - &preview_target /var/www/staging.fosdem.org/public/pr-${CI_COMMIT_PULL_REQUEST}
  - &live_target /var/www/fosdem.org/public/2027/

steps:
  - name: build
    image: *nix_image
    environment:
      NIX_CONFIG: *nix_config
    commands:
      - nix develop -c just fetch
      - nix develop -c hugo build
      - nix develop -c validate-ics public
    when:
      - event: pull_request

  - name: build-preview
    image: *nix_image
    environment:
      NIX_CONFIG: *nix_config
    commands:
      - nix develop -c just build-preview "$CI_COMMIT_PULL_REQUEST"
      - 'echo "preview at https://staging.fosdem.org/pr-$CI_COMMIT_PULL_REQUEST/"'
    when:
      - event: pull_request

  - name: deploy-preview
    image: *rsync_image
    settings:
      hosts:
        - www-public0.fosdem.org
      user: www-staging
      key:
        from_secret: staging_publish_key
      source: dist/pr-${CI_COMMIT_PULL_REQUEST}/
      target: *preview_target
      recursive: true
      delete: true
    when:
      - event: pull_request

  - name: comment-preview
    image: *comment_image
    settings:
      token:
        from_secret: forgejo_token
      marker: preview-link
      comment: "Staging preview: https://staging.fosdem.org/pr-${CI_COMMIT_PULL_REQUEST}/"
    when:
      - event: pull_request

  - name: build-live
    image: *nix_image
    environment:
      NIX_CONFIG: *nix_config
    commands:
      - nix develop -c just build-live
    when:
      - event: push
        branch: main
      - event: cron
        cron: pretalx

  - name: deploy-live
    image: *rsync_image
    settings:
      hosts:
        - www-public0.fosdem.org
      user: www-live
      key:
        from_secret: live_publish_key
      source: dist/live/
      target: *live_target
      recursive: true
      delete: true
    when:
      - event: push
        branch: main
      - event: cron
        cron: pretalx

  - name: empty-preview
    image: *nix_image
    commands:
      - mkdir -p empty
    when:
      - event: pull_request_closed

  - name: cleanup-preview
    image: *rsync_image
    settings:
      hosts:
        - www-public0.fosdem.org
      user: www-staging
      key:
        from_secret: staging_publish_key
      source: empty/
      target: *preview_target
      recursive: true
      delete: true
    when:
      - event: pull_request_closed
